[project]
name = "flatsplit-api"
version = "0.0.0"
description = "FlatSplit API and data-pipeline Lambda handlers"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aws-lambda-powertools>=3.20,<4",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
local = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flatsplit_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
