[project]
name = "flatsplit-workspace"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/*"]

[dependency-groups]
dev = [
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "pytest>=8,<9",
]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["services/api/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.ruff.lint.isort]
known-first-party = ["flatsplit_api"]
